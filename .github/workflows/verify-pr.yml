name: Verify CRM Changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript validation
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build production artifact
        run: pnpm run build
      - name: Verify pinned audio encoder for cPanel
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          npm pack '@ffmpeg-installer/linux-x64@4.1.0' --pack-destination "$tmp" --silent
          tar -xzf "$tmp/linux-x64-4.1.0.tgz" -C "$tmp"
          chmod +x "$tmp/package/ffmpeg"
          "$tmp/package/ffmpeg" -hide_banner -encoders 2>/dev/null | grep -Eq 'libopus'
          "$tmp/package/ffmpeg" -hide_banner -loglevel error -f lavfi -i anullsrc=r=48000:cl=mono -t 0.3 -c:a libopus -f ogg -y "$tmp/probe.ogg"
          test "$(head -c 4 "$tmp/probe.ogg")" = OggS
