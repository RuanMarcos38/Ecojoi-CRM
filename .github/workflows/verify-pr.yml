name: Verify CRM Changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript validation
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build production artifact
        run: pnpm run build
      - name: Verify pinned audio encoder for cPanel
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          archive=$(npm pack '@ffmpeg-installer/linux-x64@4.1.0' --pack-destination "$tmp" --silent)
          tar -xzf "$tmp/$archive" -C "$tmp"
          chmod +x "$tmp/package/ffmpeg"
          encoder_list=$("$tmp/package/ffmpeg" -hide_banner -encoders 2>/dev/null)
          grep -Eq 'libmp3lame' <<< "$encoder_list"
          "$tmp/package/ffmpeg" -hide_banner -loglevel error -f lavfi -i anullsrc=r=44100:cl=mono -t 0.3 -c:a libmp3lame -f mp3 -y "$tmp/probe.mp3"
          test "$(head -c 3 "$tmp/probe.mp3")" = ID3
