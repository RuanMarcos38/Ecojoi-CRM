name: Build cPanel Deploy Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ecojoi-crm-cpanel-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish deploy branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_URL: https://crm.ecojoi.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate types and tests
        run: |
          pnpm run typecheck
          pnpm test

      - name: Build Next.js
        run: pnpm run build

      - name: Prepare standalone deployment tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          rm -rf deploy
          mkdir -p deploy/runtime/.next deploy/tmp

          # Next standalone carries the exact runtime dependencies used by this build.
          rsync -a .next/standalone/ deploy/runtime/
          rsync -a .next/static/ deploy/runtime/.next/static/
          if [ -d public ]; then
            rsync -a public/ deploy/runtime/public/
          fi

          # Operational/support files do not participate in runtime resolution.
          for item in .cpanel.yml database README.md SECURITY.md; do
            if [ -e "$item" ]; then
              rsync -a "$item" deploy/
            fi
          done

          # Isolate standalone dependencies from CloudLinux's node_modules symlink.
          cp scripts/cpanel-start.cjs deploy/server.js

      - name: Verify standalone runtime without build-time credentials
        run: node scripts/smoke-standalone.mjs deploy/runtime

      - name: Record deployment revision
        shell: bash
        run: |

          printf '%s\n' "$GITHUB_SHA" > deploy/DEPLOY_SOURCE_SHA
          printf '%s\n' "$GITHUB_SHA" > deploy/tmp/restart.txt
          touch deploy/.nojekyll

      - name: Package cPanel deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          cd deploy
          zip -qr ../ecojoi-crm-cpanel-deploy.zip .
          cd ..
          test -s ecojoi-crm-cpanel-deploy.zip

      - name: Upload cPanel deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecojoi-crm-cpanel-deploy
          path: ecojoi-crm-cpanel-deploy.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish cpanel-deploy branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf deploy-branch
          mkdir deploy-branch
          rsync -a --delete deploy/ deploy-branch/
          cd deploy-branch
          git init
          git checkout -b cpanel-deploy
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}" || true
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cpanel-deploy

      - name: Deploy to cPanel over SSH
        if: ${{ vars.CPANEL_AUTO_DEPLOY == 'true' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${CPANEL_SSH_KEY:?Configure CPANEL_SSH_KEY}"
          : "${CPANEL_KNOWN_HOSTS:?Configure CPANEL_KNOWN_HOSTS}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$CPANEL_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh_cmd=(ssh -T -i "$ssh_dir/key" -p 5451
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts"
            ecojoi@ecojoi.com.br)
          tar -czf "$ssh_dir/release.tar.gz" -C deploy runtime server.js DEPLOY_SOURCE_SHA
          encoded_script=$(base64 -w0 scripts/deploy-cpanel-ssh.sh)
          "${ssh_cmd[@]}" "bash -c \"\$(printf '%s' '$encoded_script' | base64 -d)\" -- '$GITHUB_SHA'" < "$ssh_dir/release.tar.gz"
