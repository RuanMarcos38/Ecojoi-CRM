name: Build cPanel Deploy Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ecojoi-crm-cpanel-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish deploy branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_URL: https://crm.ecojoi.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm run build

      - name: Prepare deployment tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          items=(
            app
            components
            database
            lib
            public
            scripts
            tests
            .next
            middleware.ts
            next-env.d.ts
            next.config.ts
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            README.md
            SECURITY.md
            server.js
            tsconfig.json
          )
          for item in "${items[@]}"; do
            if [ -e "$item" ]; then
              rsync -a \
                --exclude='.next/cache' \
                --exclude='.next/diagnostics' \
                --exclude='node_modules' \
                "$item" deploy/
            fi
          done
          printf '%s\n' "$GITHUB_SHA" > deploy/DEPLOY_SOURCE_SHA
          touch deploy/.nojekyll

      - name: Publish cpanel-deploy branch
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf deploy-branch
          mkdir deploy-branch
          cd deploy-branch
          git init
          git checkout -b cpanel-deploy
          rsync -a --delete ../deploy/ ./
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}" || true
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cpanel-deploy
